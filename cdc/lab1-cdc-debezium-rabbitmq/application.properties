# ======================== 1. Source 数据源配置 (PostgreSQL) ========================
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# 数据库连接参数
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=cdc_admin
debezium.source.database.password=cdc_password
debezium.source.database.dbname=cdc_db

# 逻辑解码插件与命名标识
debezium.source.plugin.name=pgoutput
debezium.source.topic.prefix=pg_cdc

# 捕获指定表（格式：schema.tablename）
debezium.source.table.include.list=public.orders
debezium.source.decimal.handling.mode=string

# 心跳机制：每 10 秒发送一次心跳推进 LSN，防止业务低谷期 WAL 堆积撑爆磁盘
# debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.interval.ms=0

# ======================== 2. Sink 输出端配置 (RabbitMQ) ========================
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=admin
debezium.sink.rabbitmq.connection.password=password

# 投递的目标交换机（Debezium 会将消息投递到此 Exchange）
debezium.sink.rabbitmq.exchange=amq.topic



# 路由键默认映射为 topic 规则：{topic.prefix}.{schema}.{table}
# debezium.sink.rabbitmq.routingKey=pg_cdc.public.orders




# 2. 将 routingKey 直接指定为你希望进入的 Queue 名字
debezium.sink.rabbitmq.routingKey=my_cdc_queue


# ======================== 3. 序列化格式 ========================
# 采用纯 JSON 格式输出，方便下游微服务直接反序列化
debezium.format.key=json
debezium.format.value=json
debezium.format.value.schemas.enable=false
